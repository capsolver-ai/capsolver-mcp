[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "capsolver-mcp"
version = "0.1.0"
description = "MCP Server for CapSolver — expose captcha-solving capabilities to AI agents via Model Context Protocol."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["capsolver", "captcha", "mcp", "model-context-protocol", "ai-agent"]
authors = [{ name = "capsolver-ai", email = "support@capsolver.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "capsolver-core>=0.1.0",
    "mcp>=1.0.0,<2",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://capsolver.com"
Repository = "https://github.com/capsolver-ai/capsolver-mcp"
Issues = "https://github.com/capsolver-ai/capsolver-mcp/issues"
Documentation = "https://github.com/capsolver-ai/capsolver-mcp/blob/main/docs/mcp-integration.md"
Changelog = "https://github.com/capsolver-ai/capsolver-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/capsolver-ai/capsolver-mcp/blob/main/SECURITY.md"

[project.scripts]
capsolver-mcp = "capsolver_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/capsolver_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true
