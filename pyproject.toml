[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[project]
name = "capsolver-mcp"
version = "0.2.0"
description = "MCP Server for CapSolver — expose captcha-solving capabilities to AI agents via Model Context Protocol."
readme = "docs/pypi.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["capsolver", "captcha", "mcp", "model-context-protocol", "ai-agent"]
authors = [{ name = "capsolver", email = "support@capsolver.com" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=1.30,<2",
    "httpx>=0.27,<1",
    "jsonschema>=4.20,<5",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.64,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-jsonschema>=4.20",
    "build>=1.2",
]

[project.urls]
Homepage = "https://capsolver.com"
Repository = "https://github.com/capsolver-ai/capsolver-mcp"
Issues = "https://github.com/capsolver-ai/capsolver-mcp/issues"
Documentation = "https://github.com/capsolver-ai/capsolver-mcp/blob/main/README.md"

[project.scripts]
capsolver-mcp = "capsolver_mcp.__main__:main"
capsolver-browser-mcp = "capsolver_mcp.browser_server:main"

[tool.hatch.build.targets.sdist]
include = ["/src", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["src/capsolver_mcp"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
strict = true
