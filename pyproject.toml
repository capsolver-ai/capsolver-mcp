[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capsolver-mcp"
version = "0.1.0"
description = "MCP Server for CapSolver — expose captcha-solving capabilities to AI agents via Model Context Protocol."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["capsolver", "captcha", "mcp", "model-context-protocol", "ai-agent"]
authors = [{ name = "capsolver-ai", email = "dev@capsolver.ai" }]
dependencies = [
    "capsolver-core>=0.1.0",
    "mcp>=1.0.0",
]

[project.optional-dependencies]
browser = [
    "playwright>=1.40",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://capsolver.com"
Repository = "https://github.com/capsolver-ai/mcp-capsolver"
Issues = "https://github.com/capsolver-ai/mcp-capsolver/issues"

[project.scripts]
capsolver-mcp = "capsolver_mcp.__main__:main"

# ── Development only ──────────────────────────────────────────
# Remove this entire [tool.uv.sources] section before publishing to PyPI.
# These local path overrides allow editable cross-repo development.
[tool.uv.sources]
capsolver-core = { path = "../capsolver-core" }

[tool.hatch.build.targets.wheel]
packages = ["src/capsolver_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.mypy]
python_version = "3.10"
strict = true
