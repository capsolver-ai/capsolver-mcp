name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Check out the tagged release
        uses: actions/checkout@v5

      - name: Verify tag, manifest and public PyPI package
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/v* ]] || { echo "::error::Run this workflow from a release tag."; exit 1; }
          version="${GITHUB_REF#refs/tags/v}"
          name=$(jq -er '.name' server.json)
          package=$(jq -er '.packages[0].identifier' server.json)
          jq -e --arg version "$version" '.version == $version and .packages[0].version == $version' server.json
          curl -fsSL "https://pypi.org/pypi/$package/$version/json" |
            jq -e --arg marker "mcp-name: $name" --arg version "$version" '
              .info.version == $version and (.info.description | contains($marker))
              and any(.urls[]; .packagetype == "bdist_wheel" and (.yanked | not))'

      - name: Install mcp-publisher
        run: |
          set -euo pipefail
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" |
            tar xz mcp-publisher

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish

      - name: Verify the release in the Registry
        run: |
          set -euo pipefail
          name=$(jq -r '.name | @uri' server.json)
          version=$(jq -r '.version' server.json)
          endpoint="https://registry.modelcontextprotocol.io/v0.1/servers/$name/versions/$version"
          curl -fsSL --retry 5 --retry-all-errors "$endpoint" |
            jq -e --arg version "$version" '.server.version == $version and .server.packages[0].version == $version'
